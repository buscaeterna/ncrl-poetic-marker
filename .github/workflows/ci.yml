name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build static GitHub Pages site
        run: npm run build:pages

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "backend[test]"
      - run: python -m pytest backend/tests

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and start stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke test gateway
        run: |
          curl --fail http://localhost:8080/api/v1/health
          curl --fail http://localhost:8080/
          project=$(curl --fail -s -X POST http://localhost:8080/api/v1/projects -H 'content-type: application/json' -d '{"name":"CI","workspace":{"corpora":[],"poems":[],"activeId":null,"queue":[]}}')
          id=$(echo "$project" | jq -r .id)
          curl --fail "http://localhost:8080/api/v1/projects/$id"
          bash .github/scripts/container_pdf_smoke.sh
          docker compose exec -T api python tests/meter_container_smoke.py
      - name: Meter analyzer survives API and worker restart
        run: |
          docker compose restart api worker
          docker compose up -d --wait api worker
          docker compose exec -T api python tests/meter_container_smoke.py
      - name: PostgreSQL migration lifecycle
        run: |
          docker compose exec -T db createdb -U ncrl ncrl_migration_test
          NCRL_TEST_POSTGRES_URL=postgresql+psycopg://ncrl:ncrl-local-only@localhost:5432/ncrl_migration_test true
          docker compose exec -T -e NCRL_TEST_POSTGRES_URL=postgresql+psycopg://ncrl:ncrl-local-only@db:5432/ncrl_migration_test api python tests/test_migrations_postgres.py
      - name: Multi-architecture backend builds
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --file backend/Dockerfile backend
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ncrl-models
          key: silero-stress-1.4-c772725dc03c647e
      - name: Restore trusted model artifact
        run: |
          mkdir -p ~/.cache/ncrl-models
          file=~/.cache/ncrl-models/silero_stress-1.4-py3-none-any.whl
          test -f "$file" || curl --fail --location -o "$file" https://files.pythonhosted.org/packages/ba/72/5edf26c74a8d48640108976db5bc3e9e59722b63ccaa36b21894bf79ad77/silero_stress-1.4-py3-none-any.whl
          echo 'c772725dc03c647e2b33961280dc35f41b7f43ac0861575884fea0c2a6cb8ae2  '"$file" | sha256sum --check
      - name: Start local services without GPU
        run: docker compose up --build -d --wait
      - name: Offline-import and verify model
        run: |
          curl --fail -F file=@$HOME/.cache/ncrl-models/silero_stress-1.4-py3-none-any.whl http://localhost:8080/api/v1/stress/models/silero-stress/1.4/import
          for i in $(seq 1 60); do state=$(curl -s http://localhost:8080/api/v1/stress/models | jq -r '.[0].state'); test "$state" = installed && break; test "$state" = error && exit 1; sleep 1; done
          test "$state" = installed
          docker compose exec -T api python tests/silero_real_smoke.py
      - name: Model survives API and worker restart
        run: |
          docker compose restart api worker
          docker compose up -d --wait api worker
          docker compose exec -T api python tests/silero_real_smoke.py
      - if: always()
        run: docker compose down --volumes --remove-orphans
