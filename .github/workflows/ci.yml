name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build static GitHub Pages site
        run: npm run build:pages

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "backend[test]"
      - run: python -m pytest backend/tests

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and start stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke test gateway
        run: |
          curl --fail http://localhost:8080/api/v1/health
          curl --fail http://localhost:8080/
          project=$(curl --fail -s -X POST http://localhost:8080/api/v1/projects -H 'content-type: application/json' -d '{"name":"CI","workspace":{"corpora":[],"poems":[],"activeId":null,"queue":[]}}')
          id=$(echo "$project" | jq -r .id)
          curl --fail "http://localhost:8080/api/v1/projects/$id"
          job=$(curl --fail -s -X POST "http://localhost:8080/api/v1/projects/$id/jobs" -H 'content-type: application/json' -d '{"type":"workspace_summary"}')
          job_id=$(echo "$job" | jq -r .id)
          for i in {1..30}; do status=$(curl --fail -s "http://localhost:8080/api/v1/jobs/$job_id" | jq -r .status); [ "$status" = succeeded ] && break; sleep 1; done
          test "$status" = succeeded
          docker compose restart api worker
          ready=false
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/v1/ready >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail "http://localhost:8080/api/v1/projects/$id"
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
